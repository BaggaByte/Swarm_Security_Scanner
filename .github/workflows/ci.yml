name: CI / Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-security-and-tests:
    name: Backend Security & Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest flake8

      - name: Lint and Code Style
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend cycle11_ollama_swarm/agents cycle11_ollama_swarm/run_real_world.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Security Test Suite
        env:
          SWARM_API_KEY: "ci-test-key-12345"
          GITHUB_WEBHOOK_SECRET: "ci-webhook-secret"
          SWARM_ALLOW_ANONYMOUS: "false"
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build
