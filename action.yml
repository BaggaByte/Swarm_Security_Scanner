name: 'Swarm Security Scanner'
description: 'Autonomous AI-powered multi-agent SAST triage & vulnerability scanner with consensus peer-review'
author: 'BaggaByte'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api_url:
    description: 'URL of the Swarm Security Scanner API server (e.g. https://swarm.internal.company.com or http://localhost:8000)'
    required: false
    default: 'http://127.0.0.1:8000'
  api_key:
    description: 'API key for authenticating with the Swarm API server'
    required: false
    default: ''
  fail_on_severity:
    description: 'Minimum severity of confirmed True Positive to fail the CI build (CRITICAL, HIGH, MEDIUM, NONE)'
    required: false
    default: 'CRITICAL'
  sarif_output:
    description: 'Output path for generated OASIS SARIF v2.1.0 file'
    required: false
    default: 'swarm_results.sarif'
  model:
    description: 'Primary LLM model to use for analysis'
    required: false
    default: 'llama3.2'
  challenger_model:
    description: 'Adversarial challenger model'
    required: false
    default: 'qwen2.5-coder:7b'
  max_chunks:
    description: 'Maximum code chunks to scan (0 for all)'
    required: false
    default: '0'

outputs:
  run_id:
    description: 'The scan run ID generated by Swarm'
  findings_count:
    description: 'Total number of confirmed True Positive findings'
  critical_count:
    description: 'Number of critical severity findings'
  sarif_path:
    description: 'Path where the SARIF report was written'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3

    - name: Run Swarm CI Scanner
      shell: bash
      env:
        SWARM_API_URL: ${{ inputs.api_url }}
        SWARM_API_KEY: ${{ inputs.api_key }}
        SWARM_FAIL_SEVERITY: ${{ inputs.fail_on_severity }}
        SWARM_SARIF_OUTPUT: ${{ inputs.sarif_output }}
        SWARM_MODEL: ${{ inputs.model }}
        SWARM_CHALLENGER_MODEL: ${{ inputs.challenger_model }}
        SWARM_MAX_CHUNKS: ${{ inputs.max_chunks }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        python ${{ github.action_path }}/ci/swarm_ci.py
