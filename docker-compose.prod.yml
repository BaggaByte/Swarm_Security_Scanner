version: '3.8'

services:
  swarm-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: swarm-security-scanner:prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SWARM_API_KEY=${SWARM_API_KEY}
      - SWARM_ALLOW_ANONYMOUS=false
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_URL=http://ollama:11434
      - SWARM_MAX_CONCURRENT_SCANS=3
      - SWARM_SANDBOX_NETWORK=sandbox-net
      - SWARM_ALLOWED_SANDBOX_TARGETS=http://sandbox-target:5000
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - swarm_data:/app/backend/data
    depends_on:
      - docker-socket-proxy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    networks:
      - swarm-internal
      - docker-net

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
    networks:
      - docker-net
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - swarm-internal

  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: antigravity-sandbox:latest
    command: ["true"]

  sandbox-target:
    image: python:3.11-alpine
    restart: "no"
    command: ["python", "-m", "http.server", "5000"]
    networks:
      - sandbox-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  swarm_data:
  ollama_data:

networks:
  swarm-internal:
    driver: bridge
  docker-net:
    driver: bridge
    internal: true
  sandbox-net:
    driver: bridge
    internal: true
